name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --all-extras --all-groups

      - name: Audit (pre-commit + mypy)
        run: make audit

      - name: Test
        run: make test
